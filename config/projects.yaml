projects:
  content_studio:
    project_name: "Content Studio"
    project_type: "internal_division"
    crew_config: "crews/content_studio.yaml"
    status: "light"
    enabled: true
    notes: "Brief-driven content creation. All drafts require CEO approval before publishing (R3/R4)."

property_charters:
  freetraderhub:
    charter:
      version: v1
      wedge: "Prop firm traders - pass the challenge and keep the funded account. Independent rule-aware tools for FTMO, MyFundedFX, FundedNext with rolling expansion."
      property_type: website
      phase: launch
      value_readiness_date: 2026-06-17
      internal_rate_usd_hr: 75
      r12_formula_version: website_v1
      charter_file: "FREETRADERHUB_CHARTER_v1.md"
    tracking:
      website_id: freetraderhub_website
      research_website_id: freetraderhub_research
    promotion:
      promoted: true
      business_case_defined: true
      target_product_defined: true
      feasibility_validated: true
      roi_case_defined: true
      metrics_defined:
        - monthly_visitors
        - email_list_size
        - tool_completion_rate_pct
        - affiliate_mrr_usd
        - alert_mrr_usd
        - pro_mrr_usd
        - total_mrr_usd
        - content_pages_published
        - direct_costs_usd_7d
      tracked_metrics:
        - sessions_7d
        - tool_completion_rate_pct
        - total_mrr_usd
        - hours_invested_7d
        - direct_costs_usd_7d
        - quantified_value_usd_7d
      live_metrics_count: 6
      metrics_trackable: true
      notes: "Promoted as the first active operating property on 2026-05-02. Business case, target product, ROI case, and metric model are defined in revenue-model.md, revenue-streams.md, traffic-growth-plan.md, roadmap.md, and PLAN.md v5.9. Current metrics are a manual/starter feed until Umami, email, affiliate, and revenue exports are wired."
  freeghosttools:
    charter:
      version: v0-stub
      wedge: "TBD"
      property_type: website
      phase: maintain
      value_readiness_date: 2026-04-18
      internal_rate_usd_hr: 75
      r12_formula_version: website_v1
  mt5_forex_bot:
    charter:
      version: v1
      wedge: "Private MT5 trading lab for backtesting, demo/paper decision tracking, and process evidence that feeds low-risk FreeTraderHub tools. Hard rule: productize the process, not the trades."
      property_type: private_trading_lab
      phase: evidence_build
      value_readiness_date: 2026-06-03
      internal_rate_usd_hr: 75
      r12_formula_version: trading_lab_v1
      repo_path_current: "C:/Users/james/OneDrive/Documents/Claude/Projects/AI Holding Company/ai-holding-company/mt5-agentic-desk"
      repo_path_target: "C:/Users/james/OneDrive/Documents/Claude/Projects/AI Holding Company/ai-holding-company/projects/mt5-agentic-desk"
      business_plan_file: "docs/business-and-execution-plan-2026-05-04.md"
      evidence_checklist_file: "docs/evidence-build-checklist-2026-05-04.md"
    tracking:
      trading_bot_id: mt5_desk
      public_property_id: freetraderhub
    promotion:
      promoted: false
      business_case_defined: true
      target_product_defined: true
      feasibility_validated: false
      roi_case_defined: false
      monetization_boundary_defined: true
      hard_rule: "Productize the process, not the trades."
      public_monetization_allowed:
        - process_tools
        - rule_calculators
        - journaling_templates
        - education
        - disclosed_affiliate_referrals
      public_monetization_forbidden:
        - paid_signals
        - copy_trading
        - managed_accounts
        - ai_profit_claims
      autonomy_gate:
        min_demo_paper_decisions: 100
        include_no_trade_decisions: true
        min_runtime_log_days_without_unresolved_safety_failures: 30
        requires_out_of_sample_evidence: true
        requires_walk_forward_evidence: true
      metrics_defined:
        - demo_paper_decisions_logged
        - no_trade_decisions_logged
        - strategy_cohorts_tracked
        - unresolved_safety_failures
        - tool_ideas_generated
        - public_features_shipped_from_private_pain
      notes: "MT5 Agentic Desk is a private evidence engine. FreeTraderHub may monetize safer process outputs only. The repo should move under projects/ after the active workspace is no longer rooted inside the folder."
  polymarket_bot:
    charter:
      version: v0-stub
      wedge: "Polymarket arbitrage / edge strategy, VPS-hosted"
      property_type: trading_bot
      phase: maintain
      value_readiness_date: 2026-01-01
      internal_rate_usd_hr: 75
      r12_formula_version: trading_bot_v1

kpis:
  heartbeat:
    required:
      - "pnl"
      - "trades"
      - "errors"
      - "uptime"
      - "latency_ms"
  thresholds:
    max_error_lines_last_scan: 5
    max_website_latency_ms: 3000

phase2:
  enabled: true
  # Only fully revamped operating divisions run on scheduled "all" paths.
  # FreeTraderHub is the current live property; other divisions stay parked until revamped.
  operating_divisions:
    - "websites"
  crewai:
    ollama_model: "ollama/llama3.2:latest"
    ollama_base_url: "http://127.0.0.1:11434"
    temperature: 0.1
    agent_max_iter: 1
  targets:
    trading:
      mt5:
        max_cycle_age_minutes: 180
        min_active_strategies: 1
        min_best_pf: 1.3
        monitor_window_utc:
          start_hour: 7
          end_hour: 21
          run_weekends: false
      polymarket:
        daily_loss_cap_usd: 60
        max_warning_lines_24h: 2
        max_open_positions: 12
        max_trade_data_age_hours: 72
        min_resolved_trades_24h: 1
    websites:
      snapshot_uptime_ratio_min: 1.0
      max_latency_ms: 3000
      max_sitemap_age_days: 14
      max_research_report_age_days: 8
  reports:
    markdown_latest: "reports/phase2_divisions_latest.md"
    json_latest: "reports/phase2_divisions_latest.json"
  divisions:
    trading:
      spec_file: "crews/trading_bots_division.yaml"
    websites:
      spec_file: "crews/websites_division.yaml"
    content_studio:
      spec_file: "crews/content_studio.yaml"

phase3:
  enabled: true
  soul_file: "SOUL.md"
  targets_file: "config/targets.yaml"
  baseline_state_file: "state/phase3_company_baseline.json"
  r12_counter_state_file: "state/r12_property_counters.json"
  reports:
    markdown_latest: "reports/phase3_holding_latest.md"
    json_latest: "reports/phase3_holding_latest.json"
  ceo:
    spec_file: "crews/holding_ceo.yaml"
    agent_max_iter: 1
    ollama_model: "ollama/llama3.2:latest"
    ollama_base_url: "http://127.0.0.1:11434"
    temperature: 0.1
